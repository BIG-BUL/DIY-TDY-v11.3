],rel:!0,cal:!0,d:"Press ladders only. Leverage, tempo and range replace load, and skill work sits at the front while you are fresh."},{id:"calpull",n:"Calisthenics \u2014 Pull",pats:["vpull","hpull"],rel:!0,cal:!0,d:"Pull ladders and straight-arm work. Bent-arm strength builds in weeks; straight-arm builds in months, and it is programmed accordingly."},{id:"callegs",n:"Calisthenics \u2014 Legs",pats:["squat","lunge","hinge"],rel:!0,cal:!0,d:"Single-leg progressions and unloaded posterior chain work. Range and tempo do the loading."},{id:"calskill",n:"Calisthenics \u2014 Skill",pats:["vpull","hpush","vpush","antiext"],rel:!0,cal:!0,skill:!0,d:"Levers, planche and handstand progressions. Short holds, high frequency, never to failure \u2014 the limiting tissue is tendon, and it does not respond to being pushed harder."},{id:"calfull",n:"Calisthenics \u2014 Full body",pats:["vpull","hpush","squat","antiext"],rel:!0,cal:!0,d:"One rung from each ladder. The most time-efficient bodyweight session and the easiest to run anywhere."},{id:"rellower",n:"Relative strength \u2014 Lower",pats:["squat","lunge","hinge"],rel:!0,d:"Single-leg and unloaded progressions. Skill-dominant work stays early and never goes to failure."},{id:"tbgen",n:"Total body \u2014 General",pats:["squat","hinge","hpush","hpull","triple"],d:"One big lift, full-body support."},{id:"tbvert",n:"Total body \u2014 Vertical lead",pats:["squat","hinge","vpush","vpull"],d:"Overhead and hanging patterns, with the legs carrying the load."},{id:"corestab",n:"Core & Stability",pats:["antiext","rot","carry"],d:"Trunk is the cornerstone, not the afterthought."},{id:"cond",n:"Conditioning",pats:["loco","carry"],d:"Work:rest sets the system."},{id:"speed",n:"Speed & Agility",pats:["loco"],d:"Sprint, change of direction, and acceleration work."},{id:"odd",n:"Strongman / Odd object",pats:["carry","triple","hinge"],d:"Sandbag, log, yoke, ruck \u2014 awkward loads carried and lifted."},{id:"restore",n:"Restoration / Mobility",pats:["mob"],d:"Leave fresher than you arrived."}],E_=e=>EMPHASES.find(a=>a.id===e),EMPH_OK=e=>!!E_(e),migrateBlock=e=>{if(!e||typeof e!="object"||!e.mth||METHODS.some(l=>l.id===e.mth))return e;const{mth:a,mst:n,...o}=e;return o},validBlock=e=>!!(e&&typeof e=="object"&&EMPH_OK(e.e)&&ZONES.some(a=>a.id===e.z)),METHODS=[{id:"lengthened",n:"Lengthened Partials",steps:0,needs:!0,zones:["hyp","sh","meta"],d:"Full reps to near failure, then continue with partial reps in the stretched half of the range only.",rx:e=>[["Load",`${e.lb(e.rm*.7)} lb`],["Full reps","to 1\u20132 RIR"],["Then","5\u201310 partials, bottom half only"],["Rest","2\u20133 min"],["Sets","3"]],cue:"The stretched position is where the growth stimulus lives, and it's the part you lose first when you fatigue. Partials there extend the useful part of the set rather than just adding junk reps at the top.",cost:5},{id:"onequarter",n:"1\xBC Reps",steps:0,needs:!0,zones:["hyp","sh","strength"],d:"A full rep, then a quarter rep out of the bottom, then complete the rep. Each one counts as a single repetition.",rx:e=>[["Load",`${e.lb(e.rm*.6)} lb`],["Reps","6\u20138"],["Tempo","controlled, no bounce"],["Rest","2\u20133 min"],["Sets","3\u20134"]],cue:"Doubles the time spent in the hardest, most lengthened part of the range. Expect to use noticeably less weight than you'd like \u2014 that's the method working, not you having a bad day.",cost:5},{id:"tempo",n:"Tempo",steps:0,needs:!0,zones:["sh","hyp","strength","end"],d:"The clock governs the rep rather than the load. Four digits: eccentric, pause at the bottom, concentric, pause at the top.",rx:e=>[["Load",`${e.lb(e.rm*.65)} lb`],["Tempo","3-1-1-0"],["Reps","6\u20138"],["Rest","2\u20133 min"],["Sets","3\u20134"]],cue:"Useful when the load has to stay light \u2014 a cranky joint, a deload, a movement you're still learning. The time under tension does the work the weight normally would.",cost:4},{id:"preexhaust",n:"Pre-Exhaust",steps:0,needs:!1,zones:["hyp","meta","sh"],d:"A single-joint movement taken close to failure immediately before the compound that shares the same muscle.",rx:()=>[["Isolation","1 \xD7 12\u201315 to 1 RIR"],["Rest","none"],["Compound","3 \xD7 8\u201312"],["Rest","2\u20133 min between rounds"],["Rounds","3"]],cue:"The theory is that it forces the target muscle to be the limiter in the compound. The evidence for that mechanism is weak \u2014 EMG studies generally do not show it. It's still a reasonable way to get more work into a muscle with less joint load, which is a good enough reason on its own.",cost:5},{id:"density",n:"Density",steps:0,needs:!0,zones:["hyp","meta","end","sh"],d:"Fixed time, two movements, accumulate as many good reps as possible. Progress by beating last session's total in the same time.",rx:e=>[["Time","10\u201315 min"],["Load",`${e.lb(e.rm*.6)} lb`],["Reps per set","about half your max"],["Rest","as needed, keep it short"],["Score","total reps"]],cue:"Never go to failure early \u2014 the score is the whole block, not the first set. Practice-derived rather than research-backed, but it makes progression unusually concrete: you either beat the number or you didn't.",cost:8},{id:"drop",n:"Drop Sets",steps:0,needs:!0,zones:["hyp","meta","sh","end"],d:"Take a set to near failure, cut the load and continue without rest. Extends a set past the point the original weight allows.",rx:e=>[["Top set","to 1\u20132 RIR"],["Drop 1",`\u221220% \u2192 ${e.lb(e.rm*.5)} lb, to failure`],["Drop 2",`\u221220% again \u2192 ${e.lb(e.rm*.4)} lb, to failure`],["Rest","only between full sets, 2\u20133 min"],["Sets","2\u20133"]],cue:"One or two drops, on the last set of a movement only. Three drops on every set is how you accumulate fatigue without accumulating adaptation.",cost:5},{id:"mechdrop",n:"Mechanical Drop Set",steps:0,needs:!1,zones:["hyp","meta","sh"],d:"Keep the load and change the leverage instead \u2014 move to an easier version of the same movement when the harder one fails.",rx:()=>[["Position 1","hardest variation, to failure"],["Position 2","easier angle, to failure"],["Position 3","easiest angle, to failure"],["Rest","2\u20133 min between rounds"],["Rounds","2\u20133"]],cue:"Decline to flat to incline. Deficit to floor to elevated. The load never changes, only the leverage \u2014 which makes it the version that works with fixed weights or bodyweight.",cost:5},{id:"restpause",n:"Rest-Pause",steps:0,needs:!0,zones:["hyp","sh","meta"],d:"One heavy set taken near failure, then short rests and additional mini-sets with the same load.",rx:e=>[["Load",`${e.lb(e.rm*.75)} lb`],["Set 1","to 1 RIR"],["Rest","15\u201320 s"],["Mini-sets","2\u20133 more to failure"],["Total","counts as one set"]],cue:"The short rest is the whole method \u2014 long enough to get a few more reps, short enough that you never recover. One rest-pause cluster per movement is plenty.",cost:6},{id:"superset",n:"Supersets",steps:0,needs:!1,zones:["hyp","sh","meta","end"],d:"Two movements back to back with no rest between them, then a full rest before repeating.",rx:()=>[["Pairing","antagonist, or upper with lower"],["Rest between","none"],["Rest after pair","2\u20133 min"],["Sets","3\u20134 pairs"]],cue:"Only legitimate if the two movements don't compete for the same limiter. Press with row works. Press with dip just makes the second one worse.",cost:4},{id:"giant",n:"Giant Sets",steps:0,needs:!1,zones:["meta","end","hyp"],d:"Four or more movements run back to back, then one long rest.",rx:()=>[["Movements","4\u20135"],["Reps each","8\u201315"],["Rest between","none"],["Rest after round","3\u20134 min"],["Rounds","2\u20134"]],cue:"Order matters more than selection. Put the movement needing the most control first, while you can still do it well.",cost:8},{id:"straight",n:"Straight Sets",steps:0,needs:!1,d:"The zone's own prescription. Sets across at one load."},{id:"me",n:"Max Effort",steps:0,needs:!1,zones:["max","strength"],d:"Work to a top single, double or triple in a chosen variation, t Couples upward rotation with serratus drive, which is what a healthy overhead position is actually built from."},{i:"rs_bandistract",reg:"shoulder",n:"Banded Joint Distraction",tier:2,rx:"2 \xD7 45 s",d:"Band anchored, gentle traction through the joint while you move slowly in and out of a comfortable range. Traction often buys range that stretching alone will not."},{i:"rs_cuffendur",reg:"shoulder",n:"Cuff Endurance Circuit",tier:2,rx:"2 \xD7 15 each",d:"Light band, internal and external rotation, slow and continuous. The cuff fails from lack of endurance far more often than lack of strength."},{i:"rs_wristext",reg:"elbow",n:"Eccentric Wrist Extension",tier:1,rx:"3 \xD7 15, 3 s lower",d:"Lift with the other hand, lower slowly with the affected one. The standard answer for lateral elbow pain, and the slow lowering is the entire active ingredient."},{i:"rs_wristflex",reg:"elbow",n:"Eccentric Wrist Flexion",tier:1,rx:"3 \xD7 15, 3 s lower",d:"Same pattern, palm up. Targets the medial side, the one that shows up after heavy pulling and gripping."},{i:"rs_gripiso",reg:"elbow",n:"Sustained Grip Isometric",tier:1,rx:"3 \xD7 30 s",d:"Squeeze a towel or a light gripper at a steady moderate effort. Loads the forearm without the elbow moving through anything."},{i:"rs_pronsup",reg:"elbow",n:"Loaded Pronation and Supination",tier:2,rx:"2 \xD7 12 each",d:"Hammer or light dumbbell held at one end, rotating slowly. Restores the rotational tolerance that a stiff elbow quietly loses."},{i:"rs_wristload",reg:"wrist",n:"Load-Bearing Progression",tier:1,rx:"3 \xD7 20\u201330 s",d:"Fist, then knuckles, then flat palm \u2014 only progressing when the current position is genuinely painless. Rebuilds the ability to carry weight through the hand."},{i:"rs_wristcar",reg:"wrist",n:"Wrist CARs",tier:1,rx:"2 \xD7 5 each direction",d:"Slow controlled circles with the forearm still. Both a warm-up and an honest test of where the range actually stops."},{i:"rs_tendglide",reg:"wrist",n:"Tendon Glides",tier:1,rx:"2 \xD7 8 cycles",d:"Straight fingers, hook, fist, tabletop, in sequence. Keeps the tendons moving freely in their sheaths after heavy gripping."},{i:"rs_wristecc",reg:"wrist",n:"Wrist Eccentric Series",tier:2,rx:"3 \xD7 12, 3 s lower",d:"Light dumbbell, flexion and extension, lowering slowly. Build tolerance before you ask the wrist to hold a front rack again."},{i:"rs_textension",reg:"thoracic",n:"Supported Thoracic Extension",tier:1,rx:"2 \xD7 6\u20138",d:"Mid back over a roller or bench edge, ribs held down, extending only where the roller sits. Keep it segmental \u2014 if the low back is doing the bending, move the roller."},{i:"rs_openbook",reg:"thoracic",n:"Open Book Rotation",tier:1,rx:"2 \xD7 8 each",d:"Side lying, knees stacked, top arm opening across. Rotation from the mid back rather than the low back, which is where most people lose it first."},{i:"rs_threadneedle",reg:"thoracic",n:"Thread the Needle",tier:1,rx:"2 \xD7 8 each",d:"Quadruped, one arm threading under the body. Lets the shoulder blade move, which makes it a better rotation drill than most spinal twists."},{i:"rs_seatedrot",reg:"thoracic",n:"Seated Rotation Holds",tier:1,rx:"3 \xD7 20 s each",d:"Seated tall, rotating to the end of a comfortable range and holding with slow breathing. Rotation tolerance is trained by time, not by force."},{i:"rs_pressup",reg:"thoracic",n:"Prone Press-Up",tier:2,rx:"2 \xD7 10",d:"Pressing the chest up with the hips staying down. Restores extension after a day of sitting, which is most days."},{i:"rs_curlup",reg:"lumbar",n:"Modified Curl-Up",tier:1,rx:"3 \xD7 6\u20138, 8 s holds",d:"One knee bent, hands under the low back, lifting only the head and shoulders a couple of inches. The hands keep the spine from flattening, which is the whole point."},{i:"rs_sideplank",reg:"lumbar",n:"Side Plank",tier:1,rx:"3 \xD7 20\u201330 s each",d:"From the knees or the feet, hips stacked and driven up. Loads the lateral trunk without asking the spine to bend or twist under load."},{i:"rs_birddog",reg:"lumbar",n:"Bird Dog",tier:1,rx:"3 \xD7 6\u20138 each, 6 s holds",d:"Opposite arm and leg, ribs down, hips level. If the low back arches to finish the rep, shorten the reach."},{i:"rs_deadbug",reg:"lumbar",n:"Dead Bug",tier:1,rx:"3 \xD7 8 each",d:"Low back pressed flat, opposite arm and leg reaching out slowly on a long exhale. The exhale is what keeps the ribs down."},{i:"rs_hipbreath",reg:"lumbar",n:"90/90 Breathing",tier:2,rx:"5 \xD7 5 breaths",d:"Feet on a wall, hips and knees at ninety degrees, long exhale with a brief pause. Restores the stacked rib-over-pelvis position that heavy loading flattens out."},{i:"rs_hingepat",reg:"lumbar",n:"Dowel Hinge Patterning",tier:2,rx:"3 \xD7 10",d:"Dowel along the spine touching head, mid back and tailbone, hinging without losing any contact point. Rebuilds the pattern before you reload it."},{i:"rs_9090",reg:"hip",n:"90/90 Hip Switch",tier:1,rx:"3 \xD7 8 each",d:"Seated, switching the legs side to side under control. Trains internal and external rotation, which is where most stiff hips are actually stuck."},{i:"rs_hipcar",reg:"hip",n:"Hip CARs",tier:1,rx:"2 \xD7 5 each",d:"Slow circles at the largest range you control without the pelvis moving. If the low back compensates, the circle is too big."},{i:"rs_gmediso",reg:"hip",n:"Glute Medius Isometric",tier:1,rx:"3 \xD7 30 s each",d:"Side lying or in a wall lean, holding the leg out against resistance. Builds lateral hip endurance, which is what keeps a knee tracking."},{i:"rs_hipflexecc",reg:"hip",n:"Eccentric Hip Flexor Lower",tier:2,rx:"3 \xD7 8 each, 4 s",d:"From a supported tabletop position, lowering one leg slowly. Strengthens the hip flexor at length rather than just stretching it."},{i:"rs_hipairplane",reg:"hip",n:"Hip Airplane",tier:2,rx:"2 \xD7 6 each",d:"Standing on one leg, hinged, rotating the pelvis open and closed. Demanding \u2014 hold a rack for balance so the hip does the work instead of the ankle."},{i:"rs_couchmild",reg:"hip",n:"Mild Couch Stretch",tier:1,rx:"2 \xD7 45 s each",d:"Rear foot elevated, glute squeezed, pelvis tucked. The squeeze is what makes it a hip flexor stretch instead of a low back stretch."},{i:"rs_copenhagen",reg:"groin",n:"Copenhagen Adduction",tier:2,rx:"3 \xD7 6\u20138 each",d:"Side plank with the top leg on a bench, lifting the bottom leg to meet it. The strongest evidence base of any adductor exercise \u2014 start from the knee, not the foot."},{i:"rs_adductoriso",reg:"groin",n:"Adductor Squeeze Isometric",tier:1,rx:"3 \xD7 30 s",d:"Ball between the knees, squeezing at a steady moderate effort. The first thing to reintroduce and the safest way to load a grumpy adductor."},{i:"rs_frogrock",reg:"groin",n:"Frog Rock-Back",tier:1,rx:"2 \xD7 10",d:"Knees wide, rocking gently toward the heels. Opens the adductor in the position a wide stance actually demands."},{i:"rs_cossackreach",reg:"groin",n:"Cossack Reach",tier:1,rx:"2 \xD7 8 each",d:"Unloaded side-to-side shift with the trailing leg straight and the foot flat. Range under a small amount of control."},{i:"rs_spanish",reg:"knee",n:"Spanish Squat",tier:1,rx:"3 \xD7 30\u201345 s",d:"Heavy band behind the knees, sitting back against it and holding. Loads the quad and the tendon hard while the knee barely travels \u2014 the single most useful thing for a cranky knee."},{i:"rs_tke",reg:"knee",n:"Terminal Knee Extension",tier:1,rx:"3 \xD7 15 each",d:"Band behind the knee, straightening against it. Rebuilds the last few degrees of extension, which are the first to disappear and the last to come back."},{i:"rs_quadiso",reg:"knee",n:"Wall Sit at Tolerable Depth",tier:1,rx:"3 \xD7 30\u201345 s",d:"Find the depth that does not hurt and hold there. Strength gains from an isometric are specific to the angle you train, so pick the angle you want back."},{i:"rs_stepdown",reg:"knee",n:"Eccentric Step-Down",tier:2,rx:"3 \xD7 8 each, 3 s",d:"From a low step, lowering slowly under control and stepping back up with the other leg. Progress the step height before you add any weight."},{i:"rs_tibraise",reg:"knee",n:"Tibialis Raise",tier:1,rx:"3 \xD7 15\u201320",d:"Heels planted, toes lifted against a wall or band. The front of the shin absorbs deceleration, and it is almost always undertrained."},{i:"rs_atgsplit",reg:"knee",n:"Supported Deep Split Squat",tier:2,rx:"2 \xD7 8 each",d:"Holding a rack for support, sinking only as deep as stays painless. Rebuilds tolerance in the deep position gradually rather than avoiding it forever."},{i:"rs_calfecc",reg:"ankle",n:"Heavy Slow Calf Raise",tier:1,rx:"3 \xD7 10, 3 s up, 3 s down",d:"Slow on the way up and the way down, through the fullest painless range. Tendon responds to sustained load and time, not to speed."},{i:"rs_soleusiso",reg:"ankle",n:"Bent-Knee Calf Raise",tier:1,rx:"3 \xD7 12\u201315",d:"Knee bent to roughly 30 degrees, which shifts the work to the soleus. It carries most of the load when you run and it gets trained far less than the calf above it."},{i:"rs_anklecar",reg:"ankle",n:"Ankle CARs",tier:1,rx:"2 \xD7 5 each direction",d:"Controlled circles with the shin still. Quick, cheap, and a reliable way to find out whether one side is more restricted than the other."},{i:"rs_dorsimob",reg:"ankle",n:"Banded Dorsiflexion",tier:1,rx:"2 \xD7 10 each",d:"Band pulling the ankle forward, knee driving over the toe with the heel down. Traction first, then range \u2014 the order matters."},{i:"rs_slbalance",reg:"ankle",n:"Single-Leg Balance",tier:1,rx:"3 \xD7 30 s each",d:"Barefoot, on the floor first and an unstable surface later. Ankles lose position sense after injury and nothing else restores it."},{i:"rs_toeyoga",reg:"ankle",n:"Toe Splay and Big Toe Press",tier:2,rx:"2 \xD7 10 each",d:"Press the big toe down without the others, then the reverse. Tedious, and it rebuilds the foot control that a stiff ankle usually took from you."}],restoreFor=(e,a)=>RESTORE.filter(n=>n.reg===e&&n.tier<=(TRANK[a]||1)),AGGRAVATE={neck:["overhead","axial"],
